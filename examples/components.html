<!doctype html>
<html lang="ru" data-bs-theme="light" data-brand-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand UI / Базовые компоненты</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../vendor/bootstrap.min.css">
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../ui-kit.css">
</head>
<body>
  <a class="brand-skip-link" href="#componentsMain">Перейти к содержимому</a>
  <main class="brand-container brand-section brand-stack" id="componentsMain" tabindex="-1">
    <h1 class="brand-h1">Базовые компоненты</h1>
    <p class="brand-body">Карточки, списки, аватары, фильтры и навигация на общей теме.</p>
    <div class="brand-cluster" role="group" aria-label="Тема примеров">
      <button class="btn btn-secondary" type="button" data-theme-mode="light">Светлая</button>
      <button class="btn btn-secondary" type="button" data-theme-mode="dark">Тёмная</button>
      <button class="btn btn-secondary" type="button" data-theme-mode="system">Системная</button>
    </div>
    <section class="brand-section" id="cards"><h2 class="brand-h2">Карточки</h2><div data-components-kind="cards"></div></section>
    <section class="brand-section" id="lists"><h2 class="brand-h2">Списки</h2><div data-components-kind="lists"></div></section>
    <section class="brand-section" id="identity"><h2 class="brand-h2">Аватары и теги</h2><div data-components-kind="identity"></div></section>
    <section class="brand-section" id="site-navigation"><h2 class="brand-h2">Навигация и панели</h2><div data-components-kind="site-navigation"></div></section>
  </main>
  <script src="../vendor/bootstrap.bundle.min.js"></script>
  <script src="../vendor/lucide-core.min.js"></script>
  <script src="../ui-kit.js"></script>
  <script src="../ui-kit-components.js"></script>
  <script src="../ui-kit-theme.js"></script>
  <script src="components.js"></script>
</body>
</html>
